name: Syntax check
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check public/app.js
      - run: node --check src/clean-worker.js
      - run: node -e "JSON.parse(require('fs').readFileSync('public/seed.json','utf8')); JSON.parse(require('fs').readFileSync('wrangler.jsonc','utf8').replace(/^\s*\/\/.*$/gm,''))"
